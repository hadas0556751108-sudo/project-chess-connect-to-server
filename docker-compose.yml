services:
  nginx:
    image: nginx:latest
    container_name: chess-nginx
    ports:
      - "9000:80"
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
    depends_on:
      - auth-service
      - matchmaking-service
      - game-server
    networks:
      - chess-network

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.auth
    container_name: chess-auth
    environment:
      MONGO_URI: "mongodb://mongodb:27017/chess"
      JWT_SECRET: "dev-secret-do-not-use-in-production"
      AUTH_PORT: "8081"
    ports:
      - "9001:8081"
    depends_on:
      - mongodb
    networks:
      - chess-network

  matchmaking-service:
    build:
      context: .
      dockerfile: Dockerfile.matchmaking
    container_name: chess-matchmaking
    environment:
      REDIS_URL: "redis://redis:6379"
      ELO_RANGE: "100"
      MATCH_TIMEOUT_SECONDS: "60"
      MATCHMAKING_PORT: "8082"
      MATCHMAKING_ID: "matchmaking-1"
    ports:
      - "9002:8082"
    depends_on:
      - redis
    networks:
      - chess-network

  game-server:
    build:
      context: .
      dockerfile: Dockerfile.game
    container_name: chess-game
    environment:
      REDIS_URL: "redis://redis:6379"
      MONGO_URI: "mongodb://mongodb:27017/chess"
      GAME_SERVER_PORT: "8083"
      GAME_SERVER_ID: "game-server"
      MATCHMAKING_SERVICE_URL: "http://matchmaking-service:8082"
      JWT_SECRET: "dev-secret-do-not-use-in-production"
    expose:
      - "8083"
    depends_on:
      - redis
      - mongodb
      - matchmaking-service
    networks:
      - chess-network

  redis:
    image: redis:7-alpine
    container_name: chess-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - chess-network

  mongodb:
    image: mongo:7
    container_name: chess-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: "chess"
    volumes:
      - mongodb-data:/data/db
    networks:
      - chess-network

  prometheus:
    image: prom/prometheus:latest
    container_name: chess-prometheus
    ports:
      - "9090:9090"
    configs:
      - source: prometheus_yml
        target: /etc/prometheus/prometheus.yml
    volumes:
      - prometheus-data:/prometheus
    networks:
      - chess-network

  grafana:
    image: grafana/grafana:latest
    container_name: chess-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "admin"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - chess-network

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: chess-jaeger
    ports:
      - "16686:16686"
      - "14268:14268"
    networks:
      - chess-network

configs:
  nginx_conf:
    content: |
      server {
          listen 80;
          server_name localhost;

          location /auth/ {
              proxy_pass http://auth-service:8081/;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
          }

          location /match/ {
              proxy_pass http://matchmaking-service:8082/;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_set_header Host $$host;
          }

          location /game/ {
              proxy_pass http://game-server:8083/;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_set_header Host $$host;
          }
      }

  prometheus_yml:
    content: |
      global:
        scrape_interval: 15s
      scrape_configs:
        - job_name: 'prometheus'
          static_configs:
            - targets: ['localhost:9090']
        - job_name: 'chess-services'
          static_configs:
            - targets: ['auth-service:8081', 'matchmaking-service:8082', 'game-server:8083']

volumes:
  mongodb-data:
  redis-data:
  grafana-data:
  prometheus-data:

networks:
  chess-network:
    driver: bridge
